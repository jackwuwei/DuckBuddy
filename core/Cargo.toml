[package]
name = "duck-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "DuckBuddy 共享协议核心：BLE 分帧、Noise 认证会话、JSON-RPC 编解码、站姿、摇杆映射、语音轮次"
publish = false

[lib]
name = "duck_core"
# staticlib → iOS xcframework；cdylib → Android jniLibs；lib → cargo test / bindgen
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
# 协议直接跟随官方 main（mobile-app.md §5）：协议一改，本核心就编译失败。
duck-ble = { git = "https://github.com/pollen-robotics/microduck", branch = "main" }
duck-ipc-proto = { git = "https://github.com/pollen-robotics/microduck", branch = "main" }
duck-auth = { git = "https://github.com/pollen-robotics/microduck", branch = "main" }
kinematics = { git = "https://github.com/pollen-robotics/microduck", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
uniffi = { version = "0.29", features = ["cli"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
